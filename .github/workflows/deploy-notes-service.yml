name: Deploy Notes Service to Fly.io

# Manual only (Jonathan Fly-yes gate). Do not auto-deploy on merge to master.
on:
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: notes-production-deployment
  cancel-in-progress: false

jobs:
  pre-deployment:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify production deploy env preflight
        run: bash scripts/production-deploy-env.test.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate lexicon TypeScript
        run: pnpm codegen

      - name: Lint
        run: pnpm lint

      - name: Type check and build
        run: pnpm build

      - name: Run tests
        run: |
          cd packages/notes
          LOG_LEVEL=debug LOG_ENABLED=true LOG_DESTINATION=../../test.log ../dev-infra/with-test-redis-and-db.sh node --test --import=tsx tests/*.test.ts

  deploy:
    name: Deploy to Fly.io
    needs: pre-deployment
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Fly.io CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Load production environment variables
        run: |
          set -euo pipefail
          # Explicit KEY=value writes only. Do not scrape `env | grep` into
          # GITHUB_ENV — run 33938603909 dropped LABELER_*, LOG_*, and
          # FEEDGEN_DOCUMENT_DID, so fly deploy wrote empty LABELER_DID=.
          ./scripts/production-deploy-env.sh --write-github-env

      - name: Deploy to Fly.io
        run: |
          set -euo pipefail
          # Re-load from production.env in this step and fail closed.
          # GITHUB_ENV is not the source of truth for fly --env values.
          # fly deploy --env KEY=value clobbers that machine env key; empty
          # values wipe the previous working value (run 33938603909). The
          # sourced script builds FLY_DEPLOY_ENV_ARGS with non-empty keys only.
          # shellcheck disable=SC1091
          source ./scripts/production-deploy-env.sh

          if [[ ${#FLY_DEPLOY_ENV_ARGS[@]} -eq 0 ]]; then
            echo "ERROR: no non-empty fly --env args; refusing fly deploy" >&2
            exit 1
          fi
          for _arg in "${FLY_DEPLOY_ENV_ARGS[@]}"; do
            if [[ "$_arg" == --env ]]; then
              continue
            fi
            if [[ "$_arg" == *= ]]; then
              echo "ERROR: refusing empty fly ${_arg} (would wipe machine env)" >&2
              exit 1
            fi
          done

          # flyctl treats LOG_LEVEL as its own log verbosity; strip it from
          # the process environment while still passing it to the app via --env.
          env -u LOG_LEVEL fly deploy \
            --config fly.toml \
            "${FLY_DEPLOY_ENV_ARGS[@]}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  post-deployment:
    name: Post-Deployment Validation
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Health check
        run: |
          echo "🔍 Checking service health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://atproto-notes-api.fly.dev/health)
          if [ "$response" != "200" ]; then
            echo "❌ Health check failed with status code: $response"
            exit 1
          fi
          echo "✅ Health check passed (HTTP $response)"

      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment completed successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔗 Service URL: https://atproto-notes-api.fly.dev"
          echo "🔗 Monitoring: https://fly.io/apps/atproto-notes-api/monitoring"
